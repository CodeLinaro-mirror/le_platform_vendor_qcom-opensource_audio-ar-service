[Unit]
After=sleep-apps.target
Requires=sleep-apps.target

Before=sleep-drivers.target sleep-notify@ssctl-service.service
PartOf=sleep-drivers.target

[Service]
ExecCondition = /bin/sh -c "if [ \"$(/bin/cat /sys/kernel/debug/qcom_socinfo/adsp/variant)\" = \"lemans.adsp.prodQ\" ]; then \
    /bin/echo \"detecting ar, launching sleep-notify ar audio service \" && exit 0; \
else \
    /bin/echo \"detecting non-ar, skip launching\" && exit 1; \
fi"

ExecStart=pm-notify audio-umd pm-enter
ExecStopPost=pm-notify audio-umd pm-exit

[Install]
RequiredBy=sleep-drivers.target
